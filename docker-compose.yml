# ─────────────────────────────────────────────────────────────
# Smart Finance Platform — Unified Multi-Container Architecture
# ─────────────────────────────────────────────────────────────
# Usage:
#   docker compose up --build -d
#   (or: bash scripts/deploy.sh)
#
# Production Standard Ports:
#   - caddy: Port 80 (HTTP) & Port 443 (HTTPS)
#   - web:   Port 8082 (Raw WebApp access; primary via Caddy)
#   - ml:    Port 8001 (FastAPI Microservice & OpenAPI Docs)
#   - llama: Port 8080 (llama.cpp server)
#   - mysql: Port 3306 (MySQL 8.4 Relational Database)
#   - redis: Port 6379 (Redis 7 In-Memory Cache & Huey Tasks)
#   - minio: Port 9000 (S3 API) & 9001 (S3 Web Console)
#   - dozzle: Port 8888 (Real-Time Container Logs)
# ─────────────────────────────────────────────────────────────

services:
  mysql:
    image: mysql:8.4
    container_name: smart-finance-mysql
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${MYSQL_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-db_mpesa_analyzer}
    command: --sql-mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - smart-finance-mysql-data:/var/lib/mysql
    networks:
      smart-finance-network:
        aliases:
          - mysql
          - smart-finance-mysql

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: smart-finance-web:latest
    container_name: smart-finance-web
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${WEB_RAW_PORT:-8082}:80"
    volumes:
      - ./web/app:/var/www/html/app
      - ./web/public:/var/www/html/public
      - smart-finance-web-writable:/var/www/html/writable
    environment:
      - CI_ENVIRONMENT=${CI_ENVIRONMENT:-development}
      - database.default.hostname=mysql
      - database.default.database=${DB_NAME:-db_mpesa_analyzer}
      - database.default.username=root
      - database.default.password=${MYSQL_ROOT_PASSWORD:-root_password}
      - database.default.port=3306
      - database.default.DBDriver=MySQLi
      - ML_BACKEND_URL=http://ml:9050
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_DRIVER=${STORAGE_DRIVER:-minio}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin_mpesa}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-change_this_minio_password_123!}
      - MINIO_BUCKET_PAYLOADS=${MINIO_BUCKET_PAYLOADS:-mpesa-payloads}
      - MINIO_BUCKET_BACKUPS=${MINIO_BUCKET_BACKUPS:-mpesa-backups}
      - MINIO_BUCKET_MODELS=${MINIO_BUCKET_MODELS:-mpesa-models}
      - MINIO_BUCKET_EXPORTS=${MINIO_BUCKET_EXPORTS:-mpesa-exports}
    env_file:
      - path: .env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      smart-finance-network:
        aliases:
          - web
          - smart-finance-web

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    image: smart-finance-ml:latest
    container_name: smart-finance-ml
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${ML_MPESA_ANALYZER_API_PORT:-8002}:9050"
      - "${HOST_BIND_IP:-127.0.0.1}:${ML_MPESA_ANALYZER_LLAMA_PORT:-8080}:8080"
    volumes:
      - ./ml/app:/app/app
      - ./ml/models:/models
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-db_mpesa_analyzer}
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - LLAMA_PORT=8080
      - LLM_BASE_URL=http://localhost:8080/v1
      - LLM_MODEL=${LLM_MODEL:-qwen2.5-1.5b-instruct}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai-compatible}
      - MODEL_PATH=${MODEL_PATH:-/models/qwen2.5-1.5b-instruct-q4_k_m.gguf}
      - REDIS_URL=redis://redis:6379/1
      - STORAGE_DRIVER=${STORAGE_DRIVER:-minio}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin_mpesa}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-change_this_minio_password_123!}
      - MINIO_BUCKET_MODELS=${MINIO_BUCKET_MODELS:-mpesa-models}
    env_file:
      - path: .env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9050/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      smart-finance-network:
        aliases:
          - ml
          - ml-mpesa-analyzer
          - smart-finance-ml

  redis:
    image: redis:7-alpine
    container_name: smart-finance-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - smart-finance-redis-data:/data
    networks:
      smart-finance-network:
        aliases:
          - redis
          - smart-finance-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: bitnamilegacy/minio:latest
    container_name: smart-finance-minio
    user: root
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin_mpesa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_this_minio_password_123!}
    volumes:
      - smart-finance-minio-data:/data
    networks:
      smart-finance-network:
        aliases:
          - minio
          - smart-finance-minio
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: bitnamilegacy/minio-client:latest
    container_name: smart-finance-minio-init
    user: root
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - smart-finance-network
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-admin_mpesa} $${MINIO_ROOT_PASSWORD:-change_this_minio_password_123!};
      mc mb --ignore-existing local/mpesa-payloads;
      mc mb --ignore-existing local/mpesa-backups;
      mc mb --ignore-existing local/mpesa-models;
      mc mb --ignore-existing local/mpesa-exports;
      mc ilm rule add --expire-days 90 local/mpesa-payloads 2>/dev/null || true;
      mc ilm rule add --expire-days 7 local/mpesa-exports 2>/dev/null || true;
      exit 0;
      "

  dozzle:
    image: amir20/dozzle:latest
    container_name: smart-finance-dozzle
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${DOZZLE_PORT:-8888}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_NO_ANALYTICS=true
      - DOZZLE_BASE=/logs
    networks:
      smart-finance-network:
        aliases:
          - dozzle
          - smart-finance-dozzle

  caddy:
    image: caddy:2-alpine
    container_name: smart-finance-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - smart-finance-caddy-data:/data
      - smart-finance-caddy-config:/config
    networks:
      smart-finance-network:
        aliases:
          - caddy
          - smartfinance.local
          - smart-finance-caddy
    depends_on:
      web:
        condition: service_healthy

volumes:
  smart-finance-mysql-data:
  smart-finance-web-writable:
  smart-finance-redis-data:
  smart-finance-minio-data:
  smart-finance-caddy-data:
  smart-finance-caddy-config:

networks:
  smart-finance-network:
    name: smart-finance-network
