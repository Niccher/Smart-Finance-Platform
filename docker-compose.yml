# ─────────────────────────────────────────────────────────────
# M-Pesa Analyzer Platform — Unified Multi-Container Compose
# ─────────────────────────────────────────────────────────────
# Usage:
#   docker compose up --build -d
#
# Production Standard Ports:
#   - web:   Port 80   (HTTP Web Dashboard & Mobile Gateway)
#   - ml:    Port 8001 (FastAPI Microservice & OpenAPI Docs)
#   - llama: Port 8080 (llama.cpp server)
#   - mysql: Port 3306 (MySQL 8.4 Relational Database)
# ─────────────────────────────────────────────────────────────

services:
  mysql:
    image: mysql:8.4
    container_name: shared-mysql
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${MYSQL_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-db_mpesa_analyzer}
    command: --sql-mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mpesa-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: mpesa-analyzer-web:latest
    container_name: mpesa-analyzer-webapp
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - web-writable:/var/www/html/writable
    environment:
      - CI_ENVIRONMENT=${CI_ENVIRONMENT:-development}
      - database.default.hostname=mysql
      - database.default.database=${DB_NAME:-db_mpesa_analyzer}
      - database.default.username=root
      - database.default.password=${MYSQL_ROOT_PASSWORD:-root_password}
      - database.default.port=3306
      - database.default.DBDriver=MySQLi
      - ML_BACKEND_URL=http://ml-mpesa-analyzer:9050
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_DRIVER=${STORAGE_DRIVER:-minio}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin_mpesa}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-change_this_minio_password_123!}
      - MINIO_BUCKET_PAYLOADS=${MINIO_BUCKET_PAYLOADS:-mpesa-payloads}
      - MINIO_BUCKET_BACKUPS=${MINIO_BUCKET_BACKUPS:-mpesa-backups}
      - MINIO_BUCKET_MODELS=${MINIO_BUCKET_MODELS:-mpesa-models}
      - MINIO_BUCKET_EXPORTS=${MINIO_BUCKET_EXPORTS:-mpesa-exports}
    env_file:
      - path: .env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - mpesa-network

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    image: mpesa-analyzer-ml:latest
    container_name: ml-mpesa-analyzer
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${ML_MPESA_ANALYZER_API_PORT:-8001}:9050"
      - "${HOST_BIND_IP:-127.0.0.1}:${ML_MPESA_ANALYZER_LLAMA_PORT:-8080}:8080"
    volumes:
      - ./ml/app:/app/app
      - ./ml/models:/models
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-db_mpesa_analyzer}
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - LLAMA_PORT=8080
      - LLM_BASE_URL=http://localhost:8080/v1
      - LLM_MODEL=${LLM_MODEL:-qwen2.5-1.5b-instruct}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai-compatible}
      - MODEL_PATH=${MODEL_PATH:-/models/qwen2.5-1.5b-instruct-q4_k_m.gguf}
      - REDIS_URL=redis://redis:6379/1
      - STORAGE_DRIVER=${STORAGE_DRIVER:-minio}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin_mpesa}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-change_this_minio_password_123!}
      - MINIO_BUCKET_MODELS=${MINIO_BUCKET_MODELS:-mpesa-models}
    env_file:
      - path: .env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9050/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      mpesa-network:
        aliases:
          - ml-mpesa-analyzer
          - ml

  redis:
    image: redis:7-alpine
    container_name: mpesa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      mpesa-network:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    container_name: mpesa-minio
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin_mpesa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_this_minio_password_123!}
    volumes:
      - minio-data:/data
    networks:
      mpesa-network:
        aliases:
          - minio
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: mpesa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - mpesa-network
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-admin_mpesa} $${MINIO_ROOT_PASSWORD:-change_this_minio_password_123!};
      mc mb --ignore-existing local/mpesa-payloads;
      mc mb --ignore-existing local/mpesa-backups;
      mc mb --ignore-existing local/mpesa-models;
      mc mb --ignore-existing local/mpesa-exports;
      mc ilm rule add --expire-days 90 local/mpesa-payloads 2>/dev/null || true;
      mc ilm rule add --expire-days 7 local/mpesa-exports 2>/dev/null || true;
      exit 0;
      "

volumes:
  mysql-data:
  web-writable:
  redis-data:
  minio-data:

networks:
  mpesa-network:
    name: hosts-shared-network
